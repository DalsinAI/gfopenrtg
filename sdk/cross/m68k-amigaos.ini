#
# Meson cross file for AmigaOS 3.x on a 68040 with an FPU: bebbo's
# m68k-amigaos-gcc (GFOpenAmigaGCC 16.2, libnix) and the GFOpenGPU developer
# kit (SDL 2, GL, GLES, GLA).
#
#   meson setup build --cross-file /path/to/m68k-amigaos.ini
#
# To change a setting, give a second cross file after this one with only
# the [constants] to change, for example a 68060 and another kit:
#
#   [constants]
#   kit = '/path/to/GFOpenGPU-SDK-0.6'
#   cpu = ['-m68060', '-m68881']
#
#   kit    the kit's prefix, the folder with include/ and lib/: the kit
#          itself, or a stove's prefix/m68k-amigaos
#   cross  the compilers' path and name up to "gcc"; just 'm68k-amigaos-'
#          takes them from PATH
#   cpu    -m68040 -m68881 by default. SDL, GL and GLES are hard float:
#          keep -m68881.
#   runtime -noixemul (libnix)
#   extra  -fno-tree-loop-distribute-patterns (GCC 16's loop miscompile)
#   ndk    an NDK's include folder (proto/exec.h and the rest), searched
#          after everything else
#
# What projects can test: host_machine.system() is 'amigaos',
# cpu_family() 'm68k', endian() 'big'; the compiler defines __AMIGA__,
# __amigaos__, AMIGA and __mc68040__ itself. There are no shared libraries:
# library() and both_libraries() build static ones.

[constants]
kit = '/home/da1ek/CradleLab/stoves/os32-gcc16-canvas/prefix/m68k-amigaos'
cross = '/home/da1ek/CradleLab/toolchain/openamigagcc-16.2.0-open4-x86_64-linux/bin/m68k-amigaos-'
cpu = ['-m68040', '-m68881']
runtime = ['-noixemul']
# GCC 16's loop miscompile (sdl2-config gives it too).
extra = ['-fno-tree-loop-distribute-patterns']
ndk = '/home/da1ek/CradleLab/gfopensdk/OpenNDK/Include_H'

[binaries]
c = cross + 'gcc'
cpp = cross + 'g++'
ar = cross + 'ar'
ranlib = cross + 'ranlib'
strip = cross + 'strip'
nm = cross + 'nm'
objcopy = cross + 'objcopy'
pkg-config = 'pkg-config'
# No exe_wrapper: programs can't run here, so tests and run_command on
# built programs are skipped.

[built-in options]
c_args = cpu + runtime + extra + ['-idirafter', kit / 'include', '-idirafter', ndk]
cpp_args = cpu + runtime + extra + ['-idirafter', kit / 'include', '-idirafter', ndk]
c_link_args = cpu + runtime + ['-L' + kit / 'lib']
cpp_link_args = cpu + runtime + ['-L' + kit / 'lib']
default_library = 'static'
b_staticpic = false
b_pie = false
# Only the kit's .pc files: never the host's.
pkg_config_path = []

[properties]
pkg_config_libdir = [kit / 'lib' / 'pkgconfig']
# No sys_root: the kit's .pc files give absolute paths already, and
# --sysroot would hide libnix from gcc.
needs_exe_wrapper = true

[host_machine]
system = 'amigaos'
cpu_family = 'm68k'
cpu = 'm68040'
endian = 'big'
