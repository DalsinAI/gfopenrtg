# hostlib's manifest (HOSTLIB-ABI.md): every function built from one source
# for the 68k and for the host. gen.py writes hl_ids.h (both builds) and
# hostlib_host.inc (the runtime's table) from it; `python3 hostlib/gen.py
# --check` (tests/m68k/test_hostlib.sh, in CI) fails when they are not what
# it would write, or when an id here disagrees with common/amiga/ac_magic.h.
#
# An id is permanent: never reused, its contract (HOSTLIB-ABI.md, section 5)
# frozen once merged. New behaviour is a new id. ids.lock is the ledger of
# merged ids: gen.py appends to it, and --check fails when a merged id's
# frozen fields (name, id_name, version, locked, total, state_max, runtime)
# change here. Making a function total, or locked, takes a new id.
#
# Each function:
#   name      the C name (HL_FN(name)); the host build's is name_host
#   id        the ACMF tag's id; ac_magic.h defines it as AC_MAGIC_<id_name>
#   id_name   its name there, and HL_ID_<id_name> in hl_ids.h
#   version   the contract's version, as HOSTLIB-ABI.md has it
#   source    the C, under hostlib/
#   header    its block's header, under hostlib/ (optional)
#   callers   who calls the 68k build (for people; nothing reads it)
# and, with abi = 2 (HOSTLIB-ABI.md, section 8.5), each false when left out:
#   locked    a locked call: tag version $0002 (HL_TAG_LOCKED in the source),
#             state ranges (HL_NEED_S); needs
#     state      what the state is (for people), and
#     state_max  the most bytes of state one call declares, 1 to 65536
#   total     the host build never declines (a thin shell may rely on it)
#   parallel  the host build may run parts on several cores (HL_PARALLEL in
#             the source); not part of the contract, so not frozen
#   runtime   the host side is the runtime's own, not built from the source
#             (HOSTLIB_PROBE): gen.py writes no wrapper for it

abi = 2

[[function]]
name = "hostlib_ogfx_planar_rect"
id = 0x00010100
id_name = "OGFX_PLANAR_RECT"
version = 1
source = "ogfx/planar_rect.c"
header = "ogfx/leaves.h"
callers = "gfopenrtg.library GFOpenGfx planar RectFill"

